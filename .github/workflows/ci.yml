name: API checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Wedding.sln
      - run: dotnet build Wedding.sln --no-restore -c Release
      - run: dotnet test Wedding.sln --no-build -c Release --logger trx
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/Wedding.Infrastructure --startup-project src/Wedding.Api --no-build --configuration Release
      - run: dotnet run --project src/Wedding.Api --no-build -c Release -- openapi "$PWD/openapi.generated.json"
      - run: diff -u openapi.json openapi.generated.json
      - run: docker build -t wedding-api:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
